spring:
  application:
    name: TheSocial
  data:
    mongodb:
      uri: ${MONGODB_URL}
      auto-index-creation: true
      # Configuration for DocumentReference loading
      repositories:
        enabled: true
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
      enabled: true

  ai:
    vectorstore:
      qdrant:
        host: ${QDRANT_HOST:localhost}
        port: 6334
        collection-name: thesocial_corp_knowledge_base
        initialize-schema: true
    openai:
      api-key: ${OPENAI_API_KEY}
      chat:
        options:
          model: gpt-3.5-turbo
          temperature: 0.7

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

server:
  port: 8082
  host: ${SERVER_HOST}
  servlet:
    context-path: /api/v1
  cors: ${CORS_URL}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_DURATION}
  refreshable: ${JWT_REFRESH_DURATION}

# Local file storage configuration
file:
  upload-dir: ${FILE_UPLOAD_DIR:uploads}

logging:
  level:
    org.springframework.ai.vectorstore: DEBUG
    org.springframework.ai.rag: DEBUG
